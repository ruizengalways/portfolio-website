name: Deploy Preview

env:
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dr-rui-zeng-portfolio' }}
  PREVIEW_BACKEND_URL: ${{ vars.PREVIEW_BACKEND_URL || 'https://preview-api.ruizeng.dev' }}
  PREVIEW_FRONTEND_URL: ${{ vars.PREVIEW_FRONTEND_URL || 'https://preview.ruizeng.dev' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed projects
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  ci-backend:
    name: Backend CI (required before preview)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend CI
        run: npm run ci

  ci-frontend:
    name: Frontend CI (required before preview)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend CI
        run: npm run ci

  backend:
    name: Deploy backend preview
    needs: [changes, ci-backend]
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ vars.PREVIEW_BACKEND_URL || 'https://preview-api.ruizeng.dev' }}
    concurrency:
      group: backend-preview
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --env preview

      - name: Smoke test backend preview
        env:
          BACKEND_URL: ${{ env.PREVIEW_BACKEND_URL }}
          SKIP_FRONTEND: "1"
        run: bash ../scripts/test-deployment.sh

  frontend:
    name: Deploy frontend preview
    needs: [changes, ci-frontend]
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ vars.PREVIEW_FRONTEND_URL || 'https://preview.ruizeng.dev' }}
    concurrency:
      group: frontend-preview
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build:preview

      - name: Deploy to Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=preview

      - name: Print preview URL
        run: |
          echo "Preview frontend URL: ${{ env.PREVIEW_FRONTEND_URL }}"

      - name: Smoke test frontend preview
        env:
          FRONTEND_URL: ${{ env.PREVIEW_FRONTEND_URL }}
          SKIP_BACKEND: "1"
        run: bash ../scripts/test-deployment.sh
