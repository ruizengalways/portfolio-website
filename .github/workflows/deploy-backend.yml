name: Deploy Backend

env:
  PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://api.ruizeng.dev' }}

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BACKEND_URL || 'https://api.ruizeng.dev' }}
    concurrency:
      group: backend-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend CI
        run: npm run ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --env production

      - name: Smoke test production backend
        env:
          BACKEND_URL: ${{ env.PRODUCTION_BACKEND_URL }}
          SKIP_FRONTEND: "1"
        run: bash ../scripts/test-deployment.sh
